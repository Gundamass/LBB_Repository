seed: 42
data:
  root_dir: ./初赛数据
  train_pos_dir: ./初赛数据/训练集/正样本
  train_neg_dir: ./初赛数据/训练集/负样本
  test_dir: ./初赛数据/测试集/image
  val_ratio: 0.2
  min_box_size: 2.0
classes:
  background: 0
  plain particle: 1
  dirt: 2
  scratch: 3
  collision: 4
tile:
  size: 640
  overlap: 0.35
  min_visible: 0.25
  positive_jitters: 2
  rare_extra_jitters:
    dirt: 2
    collision: 6
  global_nms_iou: 0.5
  topk_final: 500
  jpeg_quality: 95
yolo:
  data_dir: ./yolo_tile_data_640
  model: yolo26m.pt
  imgsz: 1024
  epochs: 200
  batch: 32
  workers: 8
  patience: 40
  device: 2,3,4,5
  project: ./runs/yolo26_tile
  name: yolo26m_tile640_img1024
  exist_ok: true
  plots: true
  cache: false
  conf: 0.001
  iou: 0.5
  max_det: 300
  predict_batch: 16
  augment: false
inference:
  output_dir: ./outputs
  zip_name: 少样本条件下电子产品外观缺陷检测_默认团队_方案C_yolo26m_tile640_img1024.zip
