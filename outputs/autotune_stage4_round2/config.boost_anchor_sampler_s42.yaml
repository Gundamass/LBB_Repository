seed: 42
data:
  root_dir: /home/heqing/LBB_competition/初赛数据
  train_pos_dir: /home/heqing/LBB_competition/初赛数据/训练集/正样本
  train_neg_dir: /home/heqing/LBB_competition/初赛数据/训练集/负样本
  test_dir: /home/heqing/LBB_competition/初赛数据/测试集/image
  val_ratio: 0.2
  image_size: 1024
  min_box_size: 2.0
  cache_annotations: true
classes:
  background: 0
  plain particle: 1
  dirt: 2
  scratch: 3
  collision: 4
training:
  epochs: 30
  batch_size: 4
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 4
  amp: true
  grad_clip_norm: 5.0
  center_loss_weight: 0.06
  early_stopping_patience: 8
  lr_scheduler:
    name: cosine
    min_lr: 1.0e-06
sampling:
  enabled: true
  defect_weight: 3.0
  clean_weight: 1.0
  replacement: true
  num_samples_per_epoch: 160
model:
  detector_name: fasterrcnn_resnet50_fpn_v2
  pretrained: true
  score_threshold: 0.08
  nms_iou_threshold: 0.5
  detections_per_img: 300
  min_size: 1024
  max_size: 1024
  anchor_sizes:
    - [8]
    - [16]
    - [32]
    - [64]
    - [128]
  anchor_aspect_ratios:
    - [0.25, 0.5, 1.0, 2.0, 4.0]
hybrid:
  enable_classical_proposals: true
  proposal_tophat_kernel: 9
  proposal_max_per_image: 60
  enable_metric_rescore: true
  metric_temperature: 0.2
  metric_weight: 0.25
inference:
  tta:
    enabled: true
    horizontal_flip: true
    scales:
    - 1.0
    - 1.1
    - 0.9
  output_dir: /home/heqing/LBB_competition/outputs
  json_encoding: utf-8
  zip_name: 少样本条件下电子产品外观缺陷检测_默认团队_方案C.zip
system:
  checkpoints_dir: /home/heqing/LBB_competition/checkpoints/boost_anchor_sampler_s42
  logs_dir: /home/heqing/LBB_competition/logs/boost_anchor_sampler_s42
  best_ckpt_name: best_model.pt
