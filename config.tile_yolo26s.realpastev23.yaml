seed: 29161

data:
  root_dir: ./初赛数据
  train_pos_dir: ./初赛数据/训练集/正样本
  train_neg_dir: ./初赛数据/训练集/负样本
  test_dir: ./初赛数据/测试集/image
  val_ratio: 0.05
  min_box_size: 2.0
  extra_train_sets:
    - image_dir: ./outputs/realpaste_defects_v2/images
      ann_dir: ./outputs/realpaste_defects_v2/annotations
      split_tag: realpaste_defects_v2
      repeat: 1
      require_ann: true
    - image_dir: ./outputs/realpaste_defects_v3_pd_focus/images
      ann_dir: ./outputs/realpaste_defects_v3_pd_focus/annotations
      split_tag: realpaste_defects_v3_pd_focus
      repeat: 1
      require_ann: true

classes:
  background: 0
  plain particle: 1
  dirt: 2
  scratch: 3
  collision: 4

tile:
  size: 640
  overlap: 0.35
  min_visible: 0.25
  positive_jitters: 2
  extra_grid: false
  extra_positive_jitters: 1
  rare_extra_jitters:
    dirt: 1
    collision: 4
  global_nms_iou: 0.5
  topk_final: 700
  jpeg_quality: 96

yolo:
  data_dir: ./yolo_tile_data_640_realpastev23_posonly
  model: yolo26s.pt
  imgsz: 1024
  epochs: 60
  batch: 32
  workers: 8
  patience: 20
  device: 2
  project: ./runs/yolo26_tile
  name: yolo26s_tile640_img1024_realpastev23_posonly
  exist_ok: true
  plots: true
  cache: false
  conf: 0.001
  iou: 0.5
  max_det: 300
  predict_batch: 16
  augment: false

inference:
  output_dir: ./outputs
  zip_name: 少样本条件下电子产品外观缺陷检测_默认团队_方案C_yolo26s_tile640_img1024_realpastev23_posonly.zip
