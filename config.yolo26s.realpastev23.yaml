seed: 29061

data:
  root_dir: ./初赛数据
  train_pos_dir: ./初赛数据/训练集/正样本
  train_neg_dir: ./初赛数据/训练集/负样本
  test_dir: ./初赛数据/测试集/image
  val_ratio: 0.05
  min_box_size: 2.0
  extra_train_sets:
    - image_dir: ./outputs/realpaste_defects_v2/images
      ann_dir: ./outputs/realpaste_defects_v2/annotations
      split_tag: realpaste_defects_v2
      repeat: 1
      require_ann: true
    - image_dir: ./outputs/realpaste_defects_v3_pd_focus/images
      ann_dir: ./outputs/realpaste_defects_v3_pd_focus/annotations
      split_tag: realpaste_defects_v3_pd_focus
      repeat: 1
      require_ann: true

classes:
  background: 0
  plain particle: 1
  dirt: 2
  scratch: 3
  collision: 4

yolo:
  data_dir: ./yolo_data_realpastev23
  model: yolo26s.pt
  imgsz: 1536
  epochs: 80
  batch: 8
  workers: 8
  patience: 25
  device: 1
  project: ./runs/yolo26
  name: yolo26s_img1536_realpastev23
  exist_ok: true
  plots: true
  cache: false
  conf: 0.001
  iou: 0.5
  max_det: 700
  predict_batch: 4
  augment: false

inference:
  output_dir: ./outputs
  zip_name: 少样本条件下电子产品外观缺陷检测_默认团队_方案C_yolo26s_img1536_realpastev23.zip
