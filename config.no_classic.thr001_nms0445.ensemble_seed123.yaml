seed: 42
data:
  root_dir: ./初赛数据
  train_pos_dir: ./初赛数据/训练集/正样本
  train_neg_dir: ./初赛数据/训练集/负样本
  test_dir: ./初赛数据/测试集/image
  val_ratio: 0.2
  image_size: 1024
  min_box_size: 2.0
  cache_annotations: true
classes:
  background: 0
  plain particle: 1
  dirt: 2
  scratch: 3
  collision: 4
training:
  epochs: 30
  batch_size: 4
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 4
  amp: true
  grad_clip_norm: 5.0
  center_loss_weight: 0.0
  early_stopping_patience: 8
  lr_scheduler:
    name: cosine
    min_lr: 1.0e-06
model:
  detector_name: fasterrcnn_resnet50_fpn_v2
  pretrained: true
  score_threshold: 0.01
  nms_iou_threshold: 0.445
  detections_per_img: 500
hybrid:
  enable_classical_proposals: false
  proposal_tophat_kernel: 9
  proposal_max_per_image: 80
  enable_metric_rescore: true
  metric_temperature: 0.2
  metric_weight: 0.25
inference:
  tta:
    enabled: true
    horizontal_flip: true
    scales:
    - 1.0
    - 1.1
    - 0.9
  output_dir: ./outputs
  json_encoding: utf-8
  zip_name: 少样本条件下电子产品外观缺陷检测_默认团队_方案C_no_classic_thr001_nms0445_ensemble_seed123.zip
system:
  checkpoints_dir: ./checkpoints
  logs_dir: ./logs
  best_ckpt_name: best_model.pt
